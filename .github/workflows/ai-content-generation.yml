name: AI Content Generation

on:
  schedule:
    # Generate content every Tuesday and Friday at 8 AM UTC
    - cron: '0 8 * * 2'  # Tuesday
    - cron: '0 8 * * 5'  # Friday
  workflow_dispatch:
    inputs:
      topic_override:
        description: 'Override topic for content generation'
        required: false
        type: string
      target_date:
        description: 'Target publication date (YYYY-MM-DD)'
        required: false
        type: string

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  generate-content:
    # Paused on 2026-03-28 pending workflow hardening and review-flow fixes.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required: Create branches and commit generated content
      pull-requests: write  # Required: Open PR for draft review
      issues: write  # Required: Create tracking issue with content details
      actions: read  # Required: Read workflow state
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Install dependencies
        run: |
          cd .github/scripts
          pnpm install
          echo "Dependencies installed:"
          pnpm list

      - name: Generate content
        id: generate
        run: |
          echo "🚀 Starting AI content generation..."
          cd .github/scripts
          node generate-content.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic_override }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}

      - name: Create GitHub Issue for draft
        id: create-issue
        if: steps.generate.outputs.content_created == 'true'
        run: |
          ISSUE_URL=$(gh issue create \
            --title "📝 Draft: ${{ steps.generate.outputs.post_title }}" \
            --label "content,draft,automation" \
            --body "## AI-Generated Post Draft

          A new blog post draft has been generated and is ready for review.

          | Field | Value |
          |-------|-------|
          | **Topic** | ${{ steps.generate.outputs.topic }} |
          | **Target Date** | ${{ steps.generate.outputs.target_date }} |
          | **Word Count** | ${{ steps.generate.outputs.word_count }} |
          | **File** | \`apps/blog/src/content/drafts/${{ steps.generate.outputs.slug }}.md\` |
          | **Workflow Run** | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ## Next Steps
          - [ ] Review the draft in the linked PR
          - [ ] Request edits or approve the content
          - [ ] Merge PR to include draft in the repository

          ---
          *Automated draft notification — created by the AI Content Generation workflow.*")
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "✅ Issue created: $ISSUE_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create branch and commit draft
        id: commit-draft
        if: steps.generate.outputs.content_created == 'true'
        run: |
          BRANCH="automated/content-draft-${{ github.run_number }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action AI"
          git checkout -b "$BRANCH"
          git add apps/blog/src/content/drafts/
          if git diff --staged --quiet; then
            echo "No changes to commit — draft file may already exist"
            exit 0
          fi
          git commit -m "feat: add AI-generated blog post draft - ${{ steps.generate.outputs.post_title }}"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "✅ Draft committed to branch: $BRANCH"

      - name: Create Pull Request for draft
        if: steps.generate.outputs.content_created == 'true' && steps.commit-draft.outputs.branch != ''
        run: |
          gh pr create \
            --head "${{ steps.commit-draft.outputs.branch }}" \
            --base main \
            --title "📝 Draft: ${{ steps.generate.outputs.post_title }}" \
            --label "content,draft,automation" \
            --body "## AI-Generated Post Draft

          Closes #${{ steps.create-issue.outputs.issue_number }}

          | Field | Value |
          |-------|-------|
          | **Topic** | ${{ steps.generate.outputs.topic }} |
          | **Target Date** | ${{ steps.generate.outputs.target_date }} |
          | **Word Count** | ${{ steps.generate.outputs.word_count }} |
          | **File** | \`apps/blog/src/content/drafts/${{ steps.generate.outputs.slug }}.md\` |

          ## Review Checklist
          - [ ] Content is accurate and on-brand
          - [ ] Frontmatter (title, description, pubDate, tags) is correct
          - [ ] No sensitive or inappropriate content

          ---
          *This PR was created automatically by the AI Content Generation workflow.*"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          gh issue create \
            --title "🚨 Workflow Failed: AI Content Generation" \
            --label "bug,automation" \
            --body-file - <<EOF
          **Workflow Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          **Status**: Failed ❌

          **Timestamp**: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}

          **Action Required**: Check the workflow run logs to debug and fix the issue.

          ---
          *Automated failure notification*
          EOF

      - name: Summary
        if: steps.generate.outputs.content_created == 'true'
        run: |
          echo "✅ Content generated successfully!"
          echo "📝 Post: ${{ steps.generate.outputs.post_title }}"
          echo "📅 Target Date: ${{ steps.generate.outputs.target_date }}"
          echo "📊 Word Count: ${{ steps.generate.outputs.word_count }}"
          echo "🎯 Topic: ${{ steps.generate.outputs.topic }}"
          echo "📂 File: ${{ steps.generate.outputs.slug }}.md"
          echo ""
          echo "The content has been added to drafts and will be published automatically"
          echo "on the next scheduled publication date (Tuesday or Friday)."
